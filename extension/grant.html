<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allow Gradescope access</title>
<style>
  body { margin: 0; font: 16px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; color: #2d3b45; background: #f5f5f5; }
  main { max-width: 560px; margin: 12vh auto; padding: 28px 32px; background: #fff; border: 1px solid #c7cdd1; border-radius: 6px; }
  h1 { font-size: 24px; font-weight: 400; margin: 0 0 12px; }
  button { font: inherit; padding: 8px 16px; border-radius: 4px; border: 1px solid #0374b5; background: #0374b5; color: #fff; cursor: pointer; }
  #msg { margin-top: 14px; }
  .ok { color: #0b874b; } .bad { color: #c2271f; }
  @media (prefers-color-scheme: dark) { body { background: #1c2126; color: #e8ebed; } main { background: #252c32; border-color: #3b444c; } }
</style>
</head>
<body>
<main>
  <h1>Allow Gradescope access</h1>
  <p id="why"></p>
  <button id="grant" type="button">Allow gradescope.com</button>
  <p id="msg" role="status"></p>
</main>
<script src="grant.js"></script>
</body>
</html>
